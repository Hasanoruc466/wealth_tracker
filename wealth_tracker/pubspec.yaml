name: wealth_tracker
description: "Kese — net varlık takibi: altın, döviz, kripto ve borçlarınızın TL değeri."
publish_to: 'none'

version: 3.0.0+3

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Kaynak görseller tool/generate_icon.py ile üretilir.
# Yeniden oluşturmak için: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#111113"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#111113"
    theme_color: "#111113"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

# Açılış ekranı; görsel tool/generate_icon.py ile üretilir.
# Yeniden oluşturmak için: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#111113"
  image: assets/icon/splash.png
  branding: assets/icon/branding.png
  branding_mode: bottom
  android_12:
    color: "#111113"
    image: assets/icon/splash.png
    branding: assets/icon/branding.png
  web: false
